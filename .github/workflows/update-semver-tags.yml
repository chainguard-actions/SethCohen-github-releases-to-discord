name: Update SemVer Tags
on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  update_semver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update semver tags
        uses: haya14busa/action-update-semver@7d2c558640ea49e798d46539536190aff8c18715 # v1
