name: Test basic usage - send release to Discord webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start fake Discord webhook server
        run: |
          mkdir -p /tmp/webhook-capture
          cat > /tmp/fake-webhook-server.py << 'EOF'
          import http.server
          import json

          class WebhookHandler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length)
                  with open('/tmp/webhook-capture/payload.json', 'w') as f:
                      f.write(body.decode('utf-8'))
                  response = json.dumps({"id": "123456789", "type": 0, "content": ""})
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(response.encode('utf-8'))
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9999), WebhookHandler)
          server.serve_forever()
          EOF
          python3 /tmp/fake-webhook-server.py &
          echo $! > /tmp/webhook-server.pid
          # Wait for server to be ready
          for i in $(seq 1 20); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9999/ 2>/dev/null | grep -q ""; then
              sleep 0.3
              break
            fi
            sleep 0.3
          done
          sleep 1
          echo "Fake webhook server started"

      - name: Inject release event payload into GITHUB_EVENT_PATH
        run: |
          echo "Current GITHUB_EVENT_PATH: $GITHUB_EVENT_PATH"
          cat "$GITHUB_WORKSPACE/tests/fixtures/release-event.json" > "$GITHUB_EVENT_PATH"
          echo "Injected release event payload"
          cat "$GITHUB_EVENT_PATH"

      - id: action
        uses: .
        with:
          webhook_url: "http://127.0.0.1:9999/webhooks/123/abc"
          color: "2105893"
          username: "TestBot"
          content: "New release!"

      - name: Assert webhook was called with correct payload
        run: |
          echo "Checking captured webhook payload..."
          if [ ! -f /tmp/webhook-capture/payload.json ]; then
            echo "FAIL: No webhook payload was captured - action did not call the webhook"
            exit 1
          fi
          PAYLOAD=$(cat /tmp/webhook-capture/payload.json)
          echo "Captured payload: $PAYLOAD"

          if ! echo "$PAYLOAD" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assert 'embeds' in data, 'Missing embeds field'
          assert len(data['embeds']) == 1, 'Expected 1 embed'
          embed = data['embeds'][0]
          assert embed['title'] == 'Release v1.0.0', f'Wrong title: {embed[\"title\"]}'
          assert embed['url'] == 'https://github.com/owner/repo/releases/tag/v1.0.0', f'Wrong url: {embed[\"url\"]}'
          assert 'description' in embed, 'Missing description'
          assert 'Fixed a bug' in embed['description'], f'Description missing expected content: {embed[\"description\"]}'
          assert data.get('username') == 'TestBot', f'Wrong username: {data.get(\"username\")}'
          assert data.get('content') == 'New release!', f'Wrong content: {data.get(\"content\")}'
          print('All assertions passed')
          "; then
            echo "FAIL: Payload validation failed"
            exit 1
          fi
          echo "PASS: Webhook payload is correct"

      - name: Stop fake webhook server
        if: always()
        run: |
          if [ -f /tmp/webhook-server.pid ]; then
            kill $(cat /tmp/webhook-server.pid) 2>/dev/null || true
          fi
