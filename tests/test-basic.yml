name: Test basic usage - GitHub Releases to Discord
on:
  workflow_dispatch:
jobs:
  test-basic:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: release
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock release event payload
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "action": "published",
            "release": {
              "tag_name": "v1.0.0",
              "name": "Release v1.0.0",
              "body": "## What's Changed\n\n* Feature A added\n* Bug B fixed\n\n**Full Changelog**: https://github.com/test-owner/test-repo/compare/v0.9.0...v1.0.0",
              "html_url": "https://github.com/test-owner/test-repo/releases/tag/v1.0.0",
              "prerelease": false,
              "draft": false,
              "author": {
                "login": "test-user",
                "avatar_url": "https://avatars.githubusercontent.com/u/1?v=4"
              }
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "html_url": "https://github.com/test-owner/test-repo"
            }
          }
          EOF

      - name: Set event path
        run: echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook_url: https://discord.com/api/webhooks/000000000000000000/fake-webhook-token-for-testing

      - name: Assert action was invoked (network failure is expected with fake webhook)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail because the webhook URL is fake (HTTP 404 from Discord)
          # This is expected behavior - we just verify the action ran and produced a
          # recognizable failure (not a startup/syntax error)
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: Action was invoked successfully (outcome: ${{ steps.action.outcome }})"
          else
            echo "FAIL: Unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
