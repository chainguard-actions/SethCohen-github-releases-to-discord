name: Test action sends webhook with release event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Inject release event into GITHUB_EVENT_PATH
        run: |
          echo "Current GITHUB_EVENT_PATH: $GITHUB_EVENT_PATH"
          cat "$GITHUB_WORKSPACE/tests/fixtures/release-event.json" > "$GITHUB_EVENT_PATH"
          echo "Injected release event:"
          cat "$GITHUB_EVENT_PATH"

      - name: Set up mock Discord webhook server
        run: |
          mkdir -p /tmp/webhook-capture
          python3 - <<'PYEOF' &
          import http.server
          import json

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass  # suppress default logging
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  with open('/tmp/webhook-capture/payload.json', 'wb') as f:
                      f.write(body)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({"id": "123456789", "type": 0, "content": ""}).encode())
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({}).encode())

          server = http.server.HTTPServer(('127.0.0.1', 9999), Handler)
          with open('/tmp/webhook-server-ready', 'w') as f:
              f.write('ready')
          server.handle_request()  # handle one request then exit
          PYEOF
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if [ -f /tmp/webhook-server-ready ]; then
              echo "Mock webhook server ready on port 9999"
              break
            fi
            sleep 0.5
          done
          if [ ! -f /tmp/webhook-server-ready ]; then
            echo "ERROR: Mock webhook server did not start"
            exit 1
          fi

      - name: Run action with mock webhook and release event
        id: action
        uses: .
        with:
          webhook_url: 'http://127.0.0.1:9999/api/webhooks/123/abc'
          color: '5763719'
          username: 'Release Bot'
          content: 'New release published!'
          footer_title: 'GitHub Releases'
          footer_timestamp: 'true'
          reduce_headings: 'true'
          remove_github_reference_links: 'false'

      - name: Assert webhook payload was received
        run: |
          echo "Checking if webhook payload was captured..."
          if [ ! -f /tmp/webhook-capture/payload.json ]; then
            echo "FAIL: No webhook payload was captured — action may have failed to send"
            exit 1
          fi
          echo "Webhook payload received:"
          cat /tmp/webhook-capture/payload.json
          echo ""

          PAYLOAD=$(cat /tmp/webhook-capture/payload.json)

          # Check embeds array exists
          if ! echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'embeds' in d, 'No embeds field'"; then
            echo "FAIL: payload missing 'embeds' field"
            exit 1
          fi

          # Check title contains release name
          if ! echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'v1.0.0' in d['embeds'][0]['title'], f'Title missing: {d[\"embeds\"][0][\"title\"]}'"; then
            echo "FAIL: embed title does not contain release name"
            exit 1
          fi

          # Check username was set
          if ! echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('username') == 'Release Bot', f'Username wrong: {d.get(\"username\")}'"; then
            echo "FAIL: username not set correctly"
            exit 1
          fi

          # Check content was set
          if ! echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('content') == 'New release published!', f'Content wrong: {d.get(\"content\")}'"; then
            echo "FAIL: content not set correctly"
            exit 1
          fi

          echo "PASS: webhook payload received and validated successfully"
