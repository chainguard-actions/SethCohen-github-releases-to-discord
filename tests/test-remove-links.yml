name: Test remove_github_reference_links option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start fake Discord webhook server
        run: |
          mkdir -p /tmp/webhook-capture
          cat > /tmp/fake-webhook-server.py << 'EOF'
          import http.server
          import json

          class WebhookHandler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length)
                  with open('/tmp/webhook-capture/payload.json', 'w') as f:
                      f.write(body.decode('utf-8'))
                  response = json.dumps({"id": "123456789", "type": 0, "content": ""})
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(response.encode('utf-8'))
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9998), WebhookHandler)
          server.serve_forever()
          EOF
          python3 /tmp/fake-webhook-server.py &
          echo $! > /tmp/webhook-server.pid
          sleep 1
          echo "Fake webhook server started"

      - name: Inject release event with links into GITHUB_EVENT_PATH
        run: |
          echo "Current GITHUB_EVENT_PATH: $GITHUB_EVENT_PATH"
          cat "$GITHUB_WORKSPACE/tests/fixtures/release-event-with-links.json" > "$GITHUB_EVENT_PATH"
          echo "Injected release event payload"
          cat "$GITHUB_EVENT_PATH"

      - id: action
        uses: .
        with:
          webhook_url: "http://127.0.0.1:9998/webhooks/123/abc"
          remove_github_reference_links: "true"

      - name: Assert GitHub reference links were removed from description
        run: |
          echo "Checking captured webhook payload..."
          if [ ! -f /tmp/webhook-capture/payload.json ]; then
            echo "FAIL: No webhook payload was captured"
            exit 1
          fi
          PAYLOAD=$(cat /tmp/webhook-capture/payload.json)
          echo "Captured payload: $PAYLOAD"

          if ! echo "$PAYLOAD" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assert 'embeds' in data, 'Missing embeds field'
          embed = data['embeds'][0]
          desc = embed['description']
          print(f'Description: {desc}')
          # GitHub PR, issue, and commit links should be removed
          assert 'github.com/owner/repo/pull/42' not in desc, f'PR link not removed: {desc}'
          assert 'github.com/owner/repo/issues/10' not in desc, f'Issue link not removed: {desc}'
          assert 'github.com/owner/repo/commit/abc123def456' not in desc, f'Commit link not removed: {desc}'
          print('All assertions passed')
          "; then
            echo "FAIL: GitHub reference links were not removed"
            exit 1
          fi
          echo "PASS: GitHub reference links were removed from description"

      - name: Stop fake webhook server
        if: always()
        run: |
          if [ -f /tmp/webhook-server.pid ]; then
            kill $(cat /tmp/webhook-server.pid) 2>/dev/null || true
          fi
