name: Test custom_html_url and max_description options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start fake Discord webhook server
        run: |
          mkdir -p /tmp/webhook-capture
          cat > /tmp/fake-webhook-server.py << 'EOF'
          import http.server
          import json

          class WebhookHandler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length)
                  with open('/tmp/webhook-capture/payload.json', 'w') as f:
                      f.write(body.decode('utf-8'))
                  response = json.dumps({"id": "123456789", "type": 0, "content": ""})
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(response.encode('utf-8'))
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9996), WebhookHandler)
          server.serve_forever()
          EOF
          python3 /tmp/fake-webhook-server.py &
          echo $! > /tmp/webhook-server.pid
          sleep 1
          echo "Fake webhook server started"

      - name: Inject long-description release event into GITHUB_EVENT_PATH
        run: |
          echo "Current GITHUB_EVENT_PATH: $GITHUB_EVENT_PATH"
          cat "$GITHUB_WORKSPACE/tests/fixtures/release-event-long-desc.json" > "$GITHUB_EVENT_PATH"
          echo "Injected release event payload"
          cat "$GITHUB_EVENT_PATH"

      - id: action
        uses: .
        with:
          webhook_url: "http://127.0.0.1:9996/webhooks/123/abc"
          custom_html_url: "https://mywebsite.com/releases/v4.0.0"
          max_description: "100"

      - name: Assert custom_html_url replaced release url and description was truncated
        run: |
          echo "Checking captured webhook payload..."
          if [ ! -f /tmp/webhook-capture/payload.json ]; then
            echo "FAIL: No webhook payload was captured"
            exit 1
          fi
          PAYLOAD=$(cat /tmp/webhook-capture/payload.json)
          echo "Captured payload: $PAYLOAD"

          if ! echo "$PAYLOAD" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assert 'embeds' in data, 'Missing embeds field'
          embed = data['embeds'][0]

          # custom_html_url should replace the github release url
          assert embed['url'] == 'https://mywebsite.com/releases/v4.0.0', f'custom_html_url not applied: {embed[\"url\"]}'

          # description should be truncated to max_description (100 chars)
          desc = embed['description']
          print(f'Description length: {len(desc)}')
          print(f'Description: {desc}')
          # The description should be truncated - original is ~700 chars, max is 100
          assert len(desc) <= 120, f'Description not truncated properly, length={len(desc)}'

          print('All assertions passed')
          "; then
            echo "FAIL: Payload validation failed"
            exit 1
          fi
          echo "PASS: custom_html_url and max_description options work correctly"

      - name: Stop fake webhook server
        if: always()
        run: |
          if [ -f /tmp/webhook-server.pid ]; then
            kill $(cat /tmp/webhook-server.pid) 2>/dev/null || true
          fi
