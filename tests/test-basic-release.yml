name: Test basic release event with fake webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: release
      GITHUB_EVENT_PATH: ${{ github.workspace }}/pristine/SethCohen--github-releases-to-discord/v1.17.0/tests/fixtures/release-event.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook_url: 'https://discord.com/api/webhooks/000000000000000000/fake-token-for-testing'
          color: '5814783'
          username: 'Release Bot'
          content: 'A new release is available!'
          footer_title: 'GitHub Releases'
          footer_timestamp: 'true'

      - name: Assert action ran and attempted webhook call
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (if Discord returns a response) or fail
          # with a network/API error. Either way it should NOT be 'skipped'.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran and attempted to send webhook (outcome=$OUTCOME)"
