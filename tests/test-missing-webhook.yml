name: Test missing webhook_url fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with empty webhook_url (expect failure)
        id: action
        uses: .
        with:
          webhook_url: ''
        continue-on-error: true

      - name: Assert action failed due to missing webhook_url
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when webhook_url is empty, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when webhook_url was not provided"
