name: Test custom HTML URL replacement
on:
  workflow_dispatch:
jobs:
  test-custom-html-url:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock HTTP server
        run: |
          python3 -c "
          import http.server, threading, json, sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  decoded = body.decode()
                  print('Received POST body:', decoded, flush=True)
                  with open('/tmp/webhook_custom_url.json', 'w') as f:
                      f.write(decoded)
                  response_body = json.dumps({'id': '123456789', 'type': 1}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(response_body)))
                  self.end_headers()
                  self.wfile.write(response_body)
              def log_message(self, fmt, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9997), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          print('Mock server started on port 9997', flush=True)
          import time; time.sleep(60)
          " &
          sleep 1
          echo "Mock server running"

      - id: action
        uses: .
        with:
          webhook_url: "http://127.0.0.1:9997/api/webhooks/123456789/fake-token"
          release_name: "v3.0.0 - Custom URL Release"
          release_body: "Release with a custom URL replacing the GitHub release link."
          release_html_url: "https://github.com/example/repo/releases/tag/v3.0.0"
          custom_html_url: "https://mywebsite.com/changelog/v3.0.0"
          color: "16711680"

      - name: Assert custom URL is used in payload
        run: |
          echo "Action completed with custom_html_url"
          if [ -f /tmp/webhook_custom_url.json ]; then
            echo "Webhook payload received:"
            cat /tmp/webhook_custom_url.json
            # Verify the custom URL appears in the payload
            if ! grep -q "mywebsite.com/changelog/v3.0.0" /tmp/webhook_custom_url.json; then
              echo "FAIL: expected custom URL 'mywebsite.com/changelog/v3.0.0' in payload"
              exit 1
            fi
            # Verify the original GitHub URL is NOT in the payload
            if grep -q "github.com/example/repo/releases/tag/v3.0.0" /tmp/webhook_custom_url.json; then
              echo "FAIL: original GitHub URL should have been replaced by custom URL"
              exit 1
            fi
            echo "PASS: custom URL correctly replaces GitHub release URL"
          else
            echo "FAIL: no webhook payload received"
            exit 1
          fi
