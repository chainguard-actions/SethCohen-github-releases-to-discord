name: Test max_description truncation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock Discord webhook server
        run: |
          python3 -c "
          import http.server, threading, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  data = json.loads(body)
                  with open('/tmp/webhook_maxdesc_payload.json', 'w') as f:
                      json.dump(data, f)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': '111222333', 'type': 1}).encode())
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9997), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(60)
          " &
          sleep 1
          echo "Mock server started on port 9997"

      - name: Generate a long release body
        run: |
          # Generate a body that is longer than 100 characters
          python3 -c "print('A' * 500)" > /tmp/long_body.txt
          echo "Long body length: $(wc -c < /tmp/long_body.txt)"

      - id: action
        uses: .
        with:
          webhook_url: "http://127.0.0.1:9997/webhook"
          release_name: "v3.0.0"
          release_body: ""
          max_description: "100"

      - name: Assert webhook payload was received
        run: |
          if [ ! -f /tmp/webhook_maxdesc_payload.json ]; then
            echo "FAIL: webhook payload file not found"
            exit 1
          fi
          echo "Payload received"
          echo "PASS"

      - name: Assert description is truncated to max_description length
        run: |
          DESC=$(python3 -c "import json; d=json.load(open('/tmp/webhook_maxdesc_payload.json')); print(d['embeds'][0]['description'])")
          DESC_LEN=${#DESC}
          echo "actual description length: $DESC_LEN"
          echo "actual description: $DESC"
          # The description should be at most 100 chars (plus truncation marker)
          # The action adds "…" when truncating, so total should be <= 100
          if [ "$DESC_LEN" -gt 100 ]; then
            echo "FAIL: description length $DESC_LEN exceeds max_description of 100"
            exit 1
          fi
          echo "PASS: description correctly truncated to $DESC_LEN chars"

      - name: Assert description contains truncation marker
        run: |
          DESC=$(python3 -c "import json; d=json.load(open('/tmp/webhook_maxdesc_payload.json')); print(d['embeds'][0]['description'])")
          echo "actual description: $DESC"
          # The action appends "…" when truncating
          if echo "$DESC" | grep -q "…"; then
            echo "PASS: truncation marker found"
          else
            echo "FAIL: expected truncation marker '…' not found in description"
            exit 1
          fi
