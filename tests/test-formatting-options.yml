name: Test formatting options
on:
  workflow_dispatch:
jobs:
  test-formatting:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock HTTP server
        run: |
          python3 -c "
          import http.server, threading, json, sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  decoded = body.decode()
                  print('Received POST body:', decoded, flush=True)
                  # Write body to file for assertion
                  with open('/tmp/webhook_payload.json', 'w') as f:
                      f.write(decoded)
                  response_body = json.dumps({'id': '123456789', 'type': 1}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(response_body)))
                  self.end_headers()
                  self.wfile.write(response_body)
              def log_message(self, fmt, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9998), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          print('Mock server started on port 9998', flush=True)
          import time; time.sleep(60)
          " &
          sleep 1
          echo "Mock server running"

      - id: action
        uses: .
        with:
          webhook_url: "http://127.0.0.1:9998/api/webhooks/123456789/fake-token"
          release_name: "v2.0.0 - Feature Release"
          release_body: |
            ## What's Changed
            ### New Features
            - Added feature A (see #123)
            - Fixed bug B (commit abc1234)
          release_html_url: "https://github.com/example/repo/releases/tag/v2.0.0"
          color: "5763719"
          username: "Release Bot"
          avatar_url: "https://example.com/avatar.png"
          content: "New release available!"
          footer_title: "GitHub Releases"
          footer_icon_url: "https://example.com/icon.png"
          footer_timestamp: "true"
          max_description: "2048"
          remove_github_reference_links: "true"
          reduce_headings: "true"

      - name: Assert action completed and webhook was called
        run: |
          echo "Action completed with formatting options"
          if [ -f /tmp/webhook_payload.json ]; then
            echo "Webhook payload received:"
            cat /tmp/webhook_payload.json
            # Verify the payload contains expected username
            if ! grep -q "Release Bot" /tmp/webhook_payload.json; then
              echo "FAIL: expected username 'Release Bot' in payload"
              exit 1
            fi
            echo "PASS: username found in payload"
          else
            echo "FAIL: no webhook payload received"
            exit 1
          fi
