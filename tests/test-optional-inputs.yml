name: Test optional inputs - username, footer, content, custom_html_url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock Discord webhook server
        run: |
          python3 -c "
          import http.server, threading, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  data = json.loads(body)
                  with open('/tmp/webhook_optional_payload.json', 'w') as f:
                      json.dump(data, f)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'id': '987654321', 'type': 1}).encode())
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9998), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(60)
          " &
          sleep 1
          echo "Mock server started on port 9998"

      - id: action
        uses: .
        with:
          webhook_url: "http://127.0.0.1:9998/webhook"
          release_name: "v2.0.0 - Major Update"
          release_body: "### New Features\n- Added feature X\n- Fixed bug Y\n\nSee PR https://github.com/owner/repo/pull/42 for details."
          release_html_url: "https://github.com/owner/repo/releases/tag/v2.0.0"
          username: "Release Bot"
          avatar_url: "https://example.com/avatar.png"
          content: "A new release is available!"
          custom_html_url: "https://mysite.com/releases/v2.0.0"
          footer_title: "Release Footer"
          footer_icon_url: "https://example.com/icon.png"
          footer_timestamp: "true"
          remove_github_reference_links: "true"
          reduce_headings: "true"

      - name: Assert webhook payload was received
        run: |
          if [ ! -f /tmp/webhook_optional_payload.json ]; then
            echo "FAIL: webhook payload file not found"
            exit 1
          fi
          echo "Payload received:"
          cat /tmp/webhook_optional_payload.json
          echo "PASS: webhook payload received"

      - name: Assert username is set
        run: |
          USERNAME=$(python3 -c "import json; d=json.load(open('/tmp/webhook_optional_payload.json')); print(d.get('username', ''))")
          echo "actual username: $USERNAME"
          if [ "$USERNAME" != "Release Bot" ]; then
            echo "FAIL: expected username 'Release Bot', got '$USERNAME'"
            exit 1
          fi
          echo "PASS"

      - name: Assert content is set
        run: |
          CONTENT=$(python3 -c "import json; d=json.load(open('/tmp/webhook_optional_payload.json')); print(d.get('content', ''))")
          echo "actual content: $CONTENT"
          if [ "$CONTENT" != "A new release is available!" ]; then
            echo "FAIL: expected content 'A new release is available!', got '$CONTENT'"
            exit 1
          fi
          echo "PASS"

      - name: Assert custom_html_url overrides release url
        run: |
          URL=$(python3 -c "import json; d=json.load(open('/tmp/webhook_optional_payload.json')); print(d['embeds'][0].get('url', ''))")
          echo "actual url: $URL"
          if [ "$URL" != "https://mysite.com/releases/v2.0.0" ]; then
            echo "FAIL: expected custom url 'https://mysite.com/releases/v2.0.0', got '$URL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert footer_title is set
        run: |
          FOOTER=$(python3 -c "import json; d=json.load(open('/tmp/webhook_optional_payload.json')); print(d['embeds'][0].get('footer', {}).get('text', ''))")
          echo "actual footer text: $FOOTER"
          if [ "$FOOTER" != "Release Footer" ]; then
            echo "FAIL: expected footer text 'Release Footer', got '$FOOTER'"
            exit 1
          fi
          echo "PASS"

      - name: Assert footer_timestamp is present
        run: |
          TIMESTAMP=$(python3 -c "import json; d=json.load(open('/tmp/webhook_optional_payload.json')); print(d['embeds'][0].get('timestamp', ''))")
          echo "actual timestamp: $TIMESTAMP"
          if [ -z "$TIMESTAMP" ]; then
            echo "FAIL: expected a timestamp in the embed but got empty"
            exit 1
          fi
          echo "PASS: timestamp present: $TIMESTAMP"

      - name: Assert PR link is removed when remove_github_reference_links is true
        run: |
          DESC=$(python3 -c "import json; d=json.load(open('/tmp/webhook_optional_payload.json')); print(d['embeds'][0]['description'])")
          echo "actual description: $DESC"
          if echo "$DESC" | grep -q "github.com/owner/repo/pull/42"; then
            echo "FAIL: PR link should have been removed but is still present"
            exit 1
          fi
          echo "PASS: PR link correctly removed"

      - name: Assert H3 heading is reduced to bold+underline when reduce_headings is true
        run: |
          DESC=$(python3 -c "import json; d=json.load(open('/tmp/webhook_optional_payload.json')); print(d['embeds'][0]['description'])")
          echo "actual description: $DESC"
          # H3 "### New Features" should become "**__New Features__**"
          if echo "$DESC" | grep -q "\*\*__New Features__\*\*"; then
            echo "PASS: H3 heading correctly reduced to bold+underline"
          else
            echo "FAIL: H3 heading was not reduced as expected"
            exit 1
          fi
