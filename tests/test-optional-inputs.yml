name: Test optional inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with all optional inputs and no release context
        id: action
        uses: .
        with:
          webhook_url: 'https://discord.com/api/webhooks/000000000000000000/fake-token'
          color: '16711680'
          username: 'MyBot'
          avatar_url: 'https://example.com/bot-avatar.png'
          content: 'A new release is available!'
          footer_title: 'Powered by GitHub Actions'
          footer_icon_url: 'https://example.com/footer-icon.png'
          footer_timestamp: 'true'
          max_description: '2048'
          reduce_headings: 'true'
        continue-on-error: true

      - name: Assert action failed due to missing release context (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch, there's no release payload, so the action
          # should fail when trying to access github.context.payload.release
          # This confirms all optional inputs were accepted (no input validation errors)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no release context), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed at runtime (release context missing), not at input validation"
          echo "PASS: all optional inputs were accepted without validation errors"
