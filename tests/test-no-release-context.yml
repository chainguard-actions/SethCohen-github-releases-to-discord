name: Test action fails without release context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with webhook_url but no release context
        id: action
        uses: .
        with:
          webhook_url: 'https://discord.com/api/webhooks/000000000000000000/fake-token-for-testing'
          color: '2105893'
          username: 'TestBot'
        continue-on-error: true

      - name: Assert action failed due to missing release context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no release context is present, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when release context is missing"
