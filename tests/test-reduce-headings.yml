name: Test reduce_headings and footer options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start fake Discord webhook server
        run: |
          mkdir -p /tmp/webhook-capture
          cat > /tmp/fake-webhook-server.py << 'EOF'
          import http.server
          import json

          class WebhookHandler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length)
                  with open('/tmp/webhook-capture/payload.json', 'w') as f:
                      f.write(body.decode('utf-8'))
                  response = json.dumps({"id": "123456789", "type": 0, "content": ""})
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(response.encode('utf-8'))
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9997), WebhookHandler)
          server.serve_forever()
          EOF
          python3 /tmp/fake-webhook-server.py &
          echo $! > /tmp/webhook-server.pid
          sleep 1
          echo "Fake webhook server started"

      - name: Inject headings release event into GITHUB_EVENT_PATH
        run: |
          echo "Current GITHUB_EVENT_PATH: $GITHUB_EVENT_PATH"
          cat "$GITHUB_WORKSPACE/tests/fixtures/release-event-headings.json" > "$GITHUB_EVENT_PATH"
          echo "Injected release event payload"
          cat "$GITHUB_EVENT_PATH"

      - id: action
        uses: .
        with:
          webhook_url: "http://127.0.0.1:9997/webhooks/123/abc"
          reduce_headings: "true"
          footer_title: "Powered by GitHub Actions"
          footer_icon_url: "https://github.com/favicon.ico"
          footer_timestamp: "true"
          avatar_url: "https://github.com/favicon.ico"

      - name: Assert headings were reduced and footer was set
        run: |
          echo "Checking captured webhook payload..."
          if [ ! -f /tmp/webhook-capture/payload.json ]; then
            echo "FAIL: No webhook payload was captured"
            exit 1
          fi
          PAYLOAD=$(cat /tmp/webhook-capture/payload.json)
          echo "Captured payload: $PAYLOAD"

          if ! echo "$PAYLOAD" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assert 'embeds' in data, 'Missing embeds field'
          embed = data['embeds'][0]
          desc = embed['description']
          print(f'Description: {desc}')

          # H2 (##) should be converted to bold (**text**)
          assert '## Major Changes' not in desc, f'H2 heading not reduced: {desc}'
          assert '**Major Changes**' in desc, f'H2 not converted to bold: {desc}'

          # H3 (###) should be converted to bold+underline (**__text__**)
          assert '### Bug Fixes' not in desc, f'H3 heading not reduced: {desc}'
          assert '**__Bug Fixes__**' in desc, f'H3 not converted to bold+underline: {desc}'

          # Footer should be set
          footer = embed.get('footer', {})
          assert footer.get('text') == 'Powered by GitHub Actions', f'Wrong footer title: {footer}'
          assert footer.get('icon_url') == 'https://github.com/favicon.ico', f'Wrong footer icon: {footer}'

          # Timestamp should be present
          assert 'timestamp' in embed, f'Missing timestamp in embed: {embed}'

          # Avatar URL should be set
          assert data.get('avatar_url') == 'https://github.com/favicon.ico', f'Wrong avatar_url: {data.get(\"avatar_url\")}'

          print('All assertions passed')
          "; then
            echo "FAIL: Payload validation failed"
            exit 1
          fi
          echo "PASS: Headings reduced and footer options applied correctly"

      - name: Stop fake webhook server
        if: always()
        run: |
          if [ -f /tmp/webhook-server.pid ]; then
            kill $(cat /tmp/webhook-server.pid) 2>/dev/null || true
          fi
