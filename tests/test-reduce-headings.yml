name: Test reduce_headings option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: release
      GITHUB_EVENT_PATH: ${{ github.workspace }}/pristine/SethCohen--github-releases-to-discord/v1.17.0/tests/fixtures/release-event.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook_url: 'https://discord.com/api/webhooks/000000000000000000/fake-token-for-testing'
          reduce_headings: 'true'
          max_description: '2048'

      - name: Assert action ran with reduce_headings enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (not be skipped) — it will fail due to fake webhook URL
          # but should have processed the release body with heading reduction
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with reduce_headings=true (outcome=$OUTCOME)"
